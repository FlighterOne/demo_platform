let shellMode = false;
function page(html, opts = {}) {
  const f = flashMsg ? `<div class="flash ${flashMsg.type}">${esc(flashMsg.msg)}</div>` : '';
  flashMsg = null;
  if (shellMode) {
    $('#app').innerHTML = `<div class="shell ${isStaff() ? 'has-left' : ''}">
      ${isStaff() ? `<aside class="panel left" id="pleft">${adminPanel()}</aside>` : ''}
      <section class="main-area">${f}${html}</section>
      <aside class="panel right" id="pright">${cabinetPanel()}</aside>
      <div class="drawer-bg" id="dbg"></div></div>`;
    $('#dbg').onclick = () => toggleDrawer();
    const lo = $('#plogout'); if (lo) lo.onclick = logout;
    bindPanelDrawers();
    labelTables();
  } else {
    $('#app').innerHTML = opts.full ? html : `<div class="wrap page">${f}${html}</div>`;
  }
  if (!opts.keepScroll && !softRender) window.scrollTo(0, 0);

// На телефоне строки таблиц показываются карточками: подписываем ячейки названиями колонок.
function labelTables() {
  document.querySelectorAll('.main-area table:not(.atable)').forEach((t) => {
    const heads = Array.from(t.querySelectorAll('thead th, tr:first-child th')).map((th) => th.textContent.trim());
    if (!heads.length) return;
    t.classList.add('mcards');
    t.querySelectorAll('tr').forEach((tr) => Array.from(tr.children).forEach((td, i) => { if (td.tagName === 'TD' && heads[i] && !td.hasAttribute('colspan')) td.dataset.label = heads[i]; }));
  });
}
// Кнопки внутри шторок: из главного меню — в админ-панель и обратно.
function bindPanelDrawers() { document.querySelectorAll('.panel [data-drawer]').forEach((el) => el.onclick = () => toggleDrawer(el.dataset.drawer)); }
function toggleDrawer(side) {
  ['left', 'right'].forEach((s) => { const el = document.getElementById('p' + s); if (el) el.classList.toggle('open', s === side && !el.classList.contains('open')); });
  const any = document.querySelector('.panel.open'); const bg = $('#dbg'); if (bg) bg.classList.toggle('on', !!any);
}

function bindForm(sel, handler) {
  const form = $(sel); if (!form) return;
  form.onsubmit = async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button[type=submit],button:not([type])'); if (btn) btn.disabled = true;
    const old = form.querySelector('.flash.err'); if (old) old.remove();
    try { await handler(formData(form), form); }
    catch (err) { form.insertAdjacentHTML('afterbegin', `<div class="flash err">${esc(err.message)}</div>`); }
    finally { if (btn) btn.disabled = false; }
  };
}
function confirmClick(sel, text, fn) {
  document.querySelectorAll(sel).forEach((el) => el.onclick = async (e) => { e.preventDefault(); if (!confirm(text)) return; try { await fn(el.dataset.id, el); } catch (err) { alert(err.message); } });
}

function bindLeads() {
  document.querySelectorAll('.leadform').forEach((form) => {
    form.onsubmit = async (e) => {
      e.preventDefault();
      const d = formData(form), btn = form.querySelector('button'); btn.disabled = true;
      const old = form.querySelector('.flash.err'); if (old) old.remove();
      const r = parseInt(d.rank || '0', 10) || 0, kind = form.dataset.kind || 'buy';
      try {
        if (!CONTACT_RE.test(String(d.contact || '').trim())) throw new Error('Укажите Telegram (@username) или номер телефона: по почте мы не связываемся.');
        await api('POST', '/api/leads', { name: d.name, contact: String(d.contact).trim(), courseId: d.courseId || '', rank: r, kind, time: d.time || '',
          message: [r ? 'Тариф: ' + RANKS[r] : '', d.message, d.pdConsent ? 'Согласие на обработку ПД дано (редакция от ' + SITE.docsDate + ')' : ''].filter(Boolean).join('\n'), website: d.website });
        if (kind === 'consult') { form.innerHTML = `<h3>Вы записаны на консультацию</h3><p>Спасибо! Мы напишем вам в Telegram или позвоним, чтобы договориться о времени.</p>`; return; }
        form.innerHTML = `<h3>Заявка отправлена</h3><p>Спасибо! Мы свяжемся с вами в ближайшее время и пришлём реквизиты для оплаты. ${state.user ? 'После оплаты ваш тариф обновится и здесь откроется личный кабинет с уроками.' : 'После оплаты вы получите доступ к личному кабинету.'}</p>`;
      } catch (err) { form.insertAdjacentHTML('afterbegin', `<div class="flash err">${esc(err.message)}</div>`); btn.disabled = false; }
    };
  });
}

function lessonList(c, curId) {

}
function viewCourse(slug) {

// Документ, загруженный файлом в «Редакции сайта». .html очищается от скриптов, .txt/.md превращается в абзацы.
const docCache = {};
function docToHtml(name, text) {
  if (/\.html?$/i.test(name || '')) {
    const d = new DOMParser().parseFromString(text, 'text/html');
    d.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,svg,img').forEach((el) => el.remove());
    d.querySelectorAll('*').forEach((el) => [...el.attributes].forEach((a) => {
      if (/^on/i.test(a.name) || a.name === 'style' || a.name === 'class' || a.name === 'id' || ((a.name === 'href' || a.name === 'src') && !/^(https?:|mailto:|#)/i.test(a.value.trim()))) el.removeAttribute(a.name);
    }));
    d.querySelectorAll('h1').forEach((h) => { const h2 = d.createElement('h2'); h2.innerHTML = h.innerHTML; h.replaceWith(h2); });
    return d.body.innerHTML;
  }
  return String(text).replace(/\r\n?/g, '\n').split(/\n\s*\n/).map((b) => b.trim()).filter(Boolean).map((b) => {
    const m = b.match(/^#{1,6}\s+(.+)$/);
    if (m && !b.includes('\n')) return `<h2>${esc(m[1])}</h2>`;
    if (b.length < 120 && !b.includes('\n') && /^(\d+(\.\d+)*\.?\s+\S|[А-ЯЁA-Z0-9 .,«»"-]+$)/.test(b) && !/[.;:]$/.test(b)) return `<h2>${esc(b.replace(/^#+\s*/, ''))}</h2>`;
    return `<p>${esc(b).replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

// Столбчатая диаграмма: items = [{label, sub, parts:[{v, cls}], tip, cur}], столбцы из нескольких частей складываются.
function barChart(items, opts = {}) {
  const sum = (x) => x.parts.reduce((a, p) => a + p.v, 0);
  const max = Math.max(1, ...items.map(sum));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); return [1, 2, 2.5, 5, 10].map((k) => k * p).find((v) => v >= max); })();
  const fmt = opts.fmt || ((n) => Number.isInteger(n) ? String(n) : n.toLocaleString('ru-RU', { maximumFractionDigits: 1 }));
  const grid = [1, 0.5].map((f) => `<div class="cg" style="bottom:${f * 100}%"><span>${fmt(nice * f)}</span></div>`).join('');
  return `<div class="chart ${opts.dense ? 'dense' : ''}"><div class="plot">${grid}<div class="cols-bars">${items.map((x) => {
    const t = sum(x);
    return `<div class="bcol ${x.cur ? 'cur' : ''}" tabindex="0">${t && !opts.dense ? `<span class="bval">${fmt(t)}</span>` : ''}<div class="stack" style="height:${t / nice * 100}%"><div class="tip">${x.tip}</div>${x.parts.slice().reverse().map((p) => p.v ? `<div class="b ${p.cls}" style="flex:${p.v}"></div>` : '').join('')}</div></div>`;
  }).join('')}</div></div>
    <div class="xlab">${items.map((x) => `<div class="${x.cur ? 'cur' : ''}">${x.label}${x.sub ? `<small>${x.sub}</small>` : ''}</div>`).join('')}</div>
    ${opts.axis ? `<div class="axis-cap muted small">${opts.axis}</div>` : ''}</div>`;
}
// Кольцевая диаграмма: parts = [{v, cls, label}]
function donut(parts, center, sub) {
  const total = parts.reduce((a, p) => a + p.v, 0) || 1, R = 70, C = 2 * Math.PI * R, gap = parts.filter((p) => p.v).length > 1 ? 2 : 0;
  let off = 0;
  const arcs = parts.map((p) => { const len = p.v / total * C; const el = p.v ? `<circle r="${R}" cx="90" cy="90" class="arc ${p.cls}" stroke-dasharray="${Math.max(len - gap, 0.01)} ${C}" stroke-dashoffset="${-off}"><title>${esc(p.label)}: ${p.v}</title></circle>` : ''; off += len; return el; }).join('');
  return `<div class="donut"><svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="${esc(sub)}"><circle r="${R}" cx="90" cy="90" class="arc track"/><g transform="rotate(-90 90 90)">${arcs}</g></svg>
    <div class="donut-c"><b>${center}</b><span>${sub}</span></div></div>`;
}

// Фото эксперта: ужимаем в браузере до 480×480 JPEG и храним прямо в настройках сайта (~40–70 КБ).
function shrinkPhoto(file) {
  return new Promise((ok, bad) => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return bad(new Error('Нужна картинка JPG, PNG или WEBP'));
    if (file.size > 15 << 20) return bad(new Error('Фото больше 15 МБ'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const side = Math.min(img.width, img.height), out = Math.min(480, side), c = document.createElement('canvas');
      c.width = c.height = out;
      c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, out, out);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error('Не удалось открыть картинку')); };
    img.src = url;
  });
}

  document.body.classList.toggle('in-shell', shellMode);
  renderHeader(shellMode); renderFooter(shellMode);
  document.title = SITE.hero.title;
  try {
    if (!parts.length || path === '/index.html') return go('/main', true);
    switch (parts[0]) {
      case 'main': return viewMain();
      case 'auth': return viewAuth(q.get('next'));
      case 'register': return viewRegister(q.get('next'));
      case 'buying': return await viewBuying();
      case 'learn': if (rank() < 1) return go(state.user ? '/buying' : '/auth?next=/learn', true); if (parts[1] === 'study') return await viewStudy(q); return await viewLearn();
      case 'course': return viewCourse(parts[1]);
      case 'lesson': return await viewLesson(parts[1]);
      case 'account': if (!state.user) return go('/auth', true); return viewAccount();
      case 'faq': case 'support': case 'privacy': case 'terms': case 'consent': return await viewDoc(parts[0]);
      case 'admin': {
        if (!state.user) return go('/auth?next=' + encodeURIComponent(path + location.search), true);
        if (!isStaff()) return go(homeFor(), true);
        if (!adminData) await loadAdmin();
        const [, sec, id] = parts;
        if (!sec) return await viewDashboard();
        if (sec === 'courses') return viewCourses(q);
        if (sec === 'course') return viewCourseForm(id);
        if (sec === 'lesson') return viewLessonForm(id, q);
        if (sec === 'users') return viewUsers(q);
        if (sec === 'user') return viewUserForm(id, q);
        if (sec === 'leads') return viewLeads(q);
        if (sec === 'site') return viewSite();
        if (sec === 'settings') return go('/admin/site', true);
      }
    }
    viewMessage('Страница не найдена');
  } catch (e) {
    if (e.status === 401) { await loadPublic().catch(() => {}); return go('/auth', true); }
    viewMessage('Ошибка', e.message);
  }
}

// внутренние ссылки открываются без перезагрузки страницы
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href]');
  if (!a || a.hasAttribute('data-ext') || a.target === '_blank' || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
  const url = new URL(a.href, location.href);
  if (url.origin !== location.origin || (BASE && !url.pathname.startsWith(BASE))) return;
  e.preventDefault();
  if (url.pathname === location.pathname && url.search === location.search && url.hash) { const t = document.getElementById(url.hash.slice(1)); if (t) t.scrollIntoView(); return; }
  history.pushState(null, '', url.pathname + url.search + url.hash);
  render();
});
window.addEventListener('popstate', render);

// ---------- живые обновления ----------
// Раз в минуту страница сообщает серверу, что она открыта (так считается время на сайте), и получает номер версии данных.
// Если эксперт выложил урок, поменял тарифы или тексты, или у ученика сменился тариф — страница подгружает новое сама.
// Страницу урока с видео и открытые формы не перерисовываем, чтобы не сбить просмотр и ввод.
let softRender = false;
async function ping() {
  if (document.visibilityState !== 'visible' || !SECURE) return;
  let r; try { r = await api('POST', '/api/ping'); } catch (e) { return; }
  if (!r || !r.v) return;
  if (!state.v) { state.v = r.v; return; }
  if (r.v === state.v) return;
  const busy = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  const path = currentPath();
  try { await loadPublic(); } catch (e) { return; }
  state.v = r.v;
  if (path.startsWith('/admin')) return;
  if (busy || path.startsWith('/lesson/')) {
    const pr = $('#pright'); if (pr) { pr.innerHTML = cabinetPanel(); const lo = $("#plogout"); if (lo) lo.onclick = logout; bindPanelDrawers(); }
    return;
  }
  softRender = true; try { await render(); } finally { softRender = false; }
}
setInterval(ping, 60000);
setTimeout(ping, 3000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') ping(); });

(async () => {
  if (!SECURE) return page(`<div class="card center"><h1>Небезопасное подключение</h1><p>В index.html адрес API должен начинаться с <b>https://</b>.</p></div>`);
  try { await loadPublic(); } catch (e) { /* сервер недоступен: показываем страницу проекта без данных курсов */ }
  render();
})();
</script>
